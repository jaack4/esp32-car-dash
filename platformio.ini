[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = /dev/ttyUSB0   ; PlatformIO finds the port automatically; set this if you have several
; Bluetooth audio needs more than the default 1.25 MB app partition
board_build.partitions = huge_app.csv
; The platform passes no optimization flag, which leaves the audio code too slow for reverb
build_flags = -O2
lib_deps =
  https://github.com/pschatzmann/arduino-audio-tools.git
  https://github.com/pschatzmann/ESP32-A2DP.git
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
